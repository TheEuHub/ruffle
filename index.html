<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#37528c">
  <meta name="description" content="A local library and player for Flash SWF games, powered by Ruffle.">
  <title>Ruffle Player</title>
  <link rel="stylesheet" href="./style.css">
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      logLevel: "warn",
      letterbox: "on",
      forceScale: true,
      forceAlign: true
    };
  </script>
  <script src="./ruffle/ruffle.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="site-shell" id="root">
    <header class="site-header" id="nav">
      <a id="logo-container" class="brand" href="./" aria-label="Ruffle Player home">
        <img class="logo" src="./ruffle/logo.svg" alt="Ruffle" width="98" height="32">
      </a>

      <div class="nav-workspace">
        <div class="tab-list" id="tab-list" role="tablist" aria-label="Choose a game source">
          <button class="tab-button" id="library-tab" type="button" role="tab" aria-selected="true" aria-controls="library-panel" tabindex="0">Library</button>
          <button class="tab-button" id="own-tab" type="button" role="tab" aria-selected="false" aria-controls="own-panel" tabindex="-1">Load your own</button>
        </div>

        <div class="select-container" id="sample-swfs-container">
          <label id="sample-swfs-label" for="game-select">Sample SWF:</label>
          <select id="game-select" aria-describedby="sample-swfs-label">
            <option value="">Select a game…</option>
          </select>
        </div>

        <section class="own-panel" id="own-panel" role="tabpanel" aria-labelledby="own-tab" hidden>
          <div id="local-file-container">
            <span id="local-file-static-label">Local SWF:</span>
            <input id="file-input" type="file" accept=".swf,application/x-shockwave-flash" hidden>
            <button class="control-button" id="choose-file" type="button">Select File</button>
            <label id="local-file-name" for="file-input">No file selected.</label>
          </div>
          <div class="own-notes">
            <span class="privacy-caption">Read locally, never uploaded.</span>
            <span class="safety-caption">Only open files you trust.</span>
          </div>
          <p class="own-status" id="own-status" role="status" aria-live="polite" hidden></p>
        </section>

        <div class="player-controls" id="player-controls" hidden>
          <button class="control-button back-button" id="back-to-library" type="button" aria-label="Back to library">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5M7.25 10h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Back to library</span>
          </button>
          <div class="now-playing">
            <span>Now playing:</span>
            <strong id="player-title">Game</strong>
          </div>
          <button class="control-button fullscreen-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen" disabled>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.25 3.75H4.5v2.75m8.25-2.75h2.75v2.75M7.25 16.25H4.5V13.5m8.25 2.75h2.75V13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Fullscreen</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main-content info-container-shown" id="main">
      <div id="player-container" aria-label="Ruffle player. Select a game or drop a local SWF file here." tabindex="0">
        <div id="overlay" aria-hidden="true"></div>
        <div class="player-slot" id="player-slot"></div>
        <div class="player-placeholder" id="player-placeholder" aria-hidden="true" hidden>
          <div>
            <strong id="placeholder-title">Getting your game ready</strong>
            <span id="placeholder-copy">Your Flash game will appear here.</span>
          </div>
        </div>
        <p class="player-status" id="player-status" role="status" aria-live="polite" hidden></p>
      </div>

      <section class="library-panel" id="library-panel" role="tabpanel" aria-labelledby="library-tab" tabindex="0">
        <div class="section-heading">
          <div>
            <h1>Library</h1>
            <p class="section-description">Choose a game to load in Ruffle.</p>
          </div>
          <span class="collection-count" id="collection-count">4</span>
        </div>

        <div class="game-grid" id="game-grid" role="list" aria-label="Games in your library"></div>

        <div class="message-panel" id="library-message" role="status" aria-live="polite" hidden>
          <span class="message-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.25" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v4M10 6.75h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <div class="message-copy">
            <h2 id="library-message-title"></h2>
            <p id="library-message-text"></p>
          </div>
          <button class="control-button text-button" id="retry-library" type="button" hidden>Try again</button>
        </div>

        <p class="library-footnote">Example entries are placeholders. Add SWFs you own or that are freely licensed; see <code>README.md</code>.</p>
      </section>
    </main>
  </div>
</body>
</html>
